name: CI/CD Pipeline

on:
  push:
    branches: [dev]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Csak a forráskódot másoljuk fel, NINCS build a CI-ban!
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/app"

      - name: SSH commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app/backend
            npm install --production
            pm2 restart all || pm2 start npm --name "backend" -- run dev --prefix ../backend

            cd /home/ubuntu/app/frontend
            npm install --legacy-peer-deps
            npm run build
            # Ha SSR vagy Node frontend, indítsd el pm2-vel is:
            # pm2 restart frontend || pm2 start npm --name "frontend" -- run start