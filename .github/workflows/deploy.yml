name: CI/CD Pipeline

on:
  push:
    branches: [dev]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/app"

      - name: Generate .env for frontend and backend
        run: |
          for DIR in frontend backend; do
            echo "NUXT_PUBLIC_COGNITO_AUTHORITY=${{ secrets.NUXT_PUBLIC_COGNITO_AUTHORITY }}" > $DIR/.env
            echo "NUXT_PUBLIC_COGNITO_CLIENT_ID=${{ secrets.NUXT_PUBLIC_COGNITO_CLIENT_ID }}" >> $DIR/.env
            echo "NUXT_PUBLIC_COGNITO_DOMAIN=${{ secrets.NUXT_PUBLIC_COGNITO_DOMAIN }}" >> $DIR/.env
            echo "NUXT_PUBLIC_COGNITO_LOGOUT_URI=${{ secrets.NUXT_PUBLIC_COGNITO_LOGOUT_URI }}" >> $DIR/.env
            echo "NUXT_PUBLIC_COGNITO_REDIRECT_URI=${{ secrets.NUXT_PUBLIC_COGNITO_REDIRECT_URI }}" >> $DIR/.env
          done
        shell: bash

      - name: SSH commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            if [ -f package.json ]; then
              if [ ! -s package.json ]; then rm package.json; fi
            fi
            if [ -f package-lock.json ]; then rm package-lock.json; fi

            docker compose pull
            docker compose up -d --build

            export NVM_DIR="$HOME/.nvm"
            if [ ! -d "$NVM_DIR" ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            fi
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install 22
            nvm use 22
            nvm alias default 22

            # Backend install & start (host, not Docker)
            cd backend
            npm install --legacy-peer-deps
            pm2 restart backend || pm2 start npm --name "backend" -- run dev

            # Frontend install & build: a .env-ből épül a Nuxt!
            cd ../frontend
            rm -rf node_modules package-lock.json
            npm cache clean --force
            npm install --legacy-peer-deps
            npm run build
            pm2 restart frontend || pm2 start npm --name "frontend" -- run start
